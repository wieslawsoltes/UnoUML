name: Test and publish UnoUML
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unouml-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  gpu-shaders:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate production WGSL and offscreen pixel output
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/gpu-checks
        run: |
          CHROMIUM_PATH="$(command -v google-chrome)" node tests/browser/gpu-shaders.mjs
          CHROMIUM_PATH="$(command -v google-chrome)" node tests/browser/gpu-scene.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-checks
          path: ${{ runner.temp }}/gpu-checks/
          if-no-files-found: ignore
  gpu-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UNOUML_REQUIRE_WEBGPU: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare native and browser dependencies
        run: |
          dotnet workload install wasm-tools --skip-manifest-update
          npm ci --ignore-scripts
          npm run prepare:renderer
      - name: Publish the Uno 7 WebGPU application
        run: |
          dotnet publish src/UnoUML.App -f net10.0-browserwasm -c Release -o "$RUNNER_TEMP/gpu-site"
          node scripts/verify-uno7-assets.mjs src/UnoUML.App/obj/project.assets.json
          node scripts/stage-pages.mjs "$RUNNER_TEMP/gpu-site/wwwroot" "$RUNNER_TEMP/gpu-pages"
      - name: Exercise actual shared-device presentation independently of language fixtures
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/gpu-workspace
        run: CHROMIUM_PATH="$(command -v google-chrome)" node tests/browser/gpu-workspace.mjs "$RUNNER_TEMP/gpu-pages"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-workspace
          path: ${{ runner.temp }}/gpu-workspace/
          if-no-files-found: ignore
  browser:
    runs-on: ubuntu-latest
    # Native/software-GPU authoring includes the primary desktop/mobile flow and
    # every isolated scenario, including the later import/native-compatibility
    # paths. Per-interaction timeouts remain in the browser tests.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install the .NET WebAssembly native tools
        run: dotnet workload install wasm-tools --skip-manifest-update
      - name: Build the Uno 7 browser host
        run: |
          dotnet build src/UnoUML.App -f net10.0-browserwasm -c Release
          node scripts/verify-uno7-assets.mjs src/UnoUML.App/obj/project.assets.json
      - name: Test source editing
        run: |
          node --test tests/publish-layout.mjs
          node --test tests/canvas-geometry.mjs
          node --test tests/gpu-geometry.mjs
          node --test tests/gpu-host.mjs
          node --test tests/gpu-paint.mjs
          node --test tests/gpu-fonts.mjs
          node --test tests/gantt-geometry.mjs
          node --test tests/source-text.mjs
          dotnet run --project tests/UnoUML.Gpu.Tests -c Release
          dotnet run --project tests/UnoUML.Core.Tests -c Release
          dotnet run --project tests/UnoUML.PlantUml.Tests -c Release
      - name: Pack the portable C# library
        run: dotnet pack src/UnoUML.PlantUml -c Release --no-build -o "$RUNNER_TEMP/packages"
      - uses: actions/upload-artifact@v4
        with:
          name: UnoUML.PlantUml
          path: ${{ runner.temp }}/packages/*.nupkg
      - name: Prepare the offline PlantUML engine and standard library
        run: |
          npm ci --ignore-scripts
          npm run prepare:renderer
      - name: Test the renderer in Chromium
        run: |
          dotnet run --no-build --project tests/UnoUML.Core.Tests -c Release -- --catalog > "$RUNNER_TEMP/catalog.json"
          dotnet run --no-build --project tests/UnoUML.PlantUml.Tests -c Release -- --catalog "$RUNNER_TEMP/catalog.json"
          UNOUML_CATALOG="$RUNNER_TEMP/catalog.json" CHROMIUM_PATH="$(command -v google-chrome)" npm run test:renderer
      - name: Publish WebAssembly
        run: dotnet publish src/UnoUML.App -f net10.0-browserwasm -c Release -o "$RUNNER_TEMP/site"
      - name: Validate static site
        run: |
          cd "$RUNNER_TEMP/site/wwwroot"
          test -s index.html
          test -s uml/viewport.js
          test -s uml/vendor/plantuml.js
          test -s uml/vendor/viz-global.js
          mkdir -p packages
          cp "$GITHUB_WORKSPACE/docs/packages/"*.nupkg packages/
          cp "$RUNNER_TEMP/packages/"*.nupkg packages/
          test -s packages/UnoUML.PlantUml.0.5.0.nupkg
      - name: Stage immutable application assets
        run: node scripts/stage-pages.mjs "$RUNNER_TEMP/site/wwwroot" "$RUNNER_TEMP/pages"
      - name: Exercise the published desktop and mobile workspace
        env:
          UNOUML_REQUIRE_WEBGPU: '1'
          SCREENSHOT_DIR: ${{ runner.temp }}/workspace-checks
        run: CHROMIUM_PATH="$(command -v google-chrome)" node tests/browser/workspace.mjs "$RUNNER_TEMP/pages"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-checks
          path: ${{ runner.temp }}/workspace-checks/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: ${{ runner.temp }}/pages
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [browser, gpu-shaders, gpu-workspace]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
