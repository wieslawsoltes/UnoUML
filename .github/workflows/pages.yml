name: Test and publish UnoUML
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unouml-pages
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Test source editing
        run: dotnet run --project tests/UnoUML.Core.Tests -c Release
      - name: Prepare the offline PlantUML engine and standard library
        run: |
          npm ci --ignore-scripts
          npm run prepare:renderer
      - name: Test the renderer in Chromium
        run: CHROMIUM_PATH="$(command -v google-chrome)" npm run test:renderer
      - name: Publish WebAssembly
        run: dotnet publish src/UnoUML.App -f net10.0-browserwasm -c Release -o "$RUNNER_TEMP/site"
      - name: Validate static site
        run: |
          cd "$RUNNER_TEMP/site/wwwroot"
          test -s index.html
          test -s uml/viewport.js
          test -s uml/vendor/plantuml.js
          test -s uml/vendor/viz-global.js
      - name: Exercise the published desktop and mobile workspace
        run: CHROMIUM_PATH="$(command -v google-chrome)" node tests/browser/workspace.mjs "$RUNNER_TEMP/site/wwwroot"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site/wwwroot
  deploy:
    needs: browser
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
