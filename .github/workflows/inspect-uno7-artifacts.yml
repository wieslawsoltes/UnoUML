name: Validate Uno 7 retained canvas overlay integration
on:
  push:
    branches: [codex/uno7-artifact-inspection]
permissions:
  contents: read
  actions: read
jobs:
  overlay-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UNOUML_EXPECTED_COMMIT: '8bfba53aec62df83b0f8fb156334c3bab2317efa'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.UNOUML_EXPECTED_COMMIT }}
          persist-credentials: false
      - name: Verify and record the exact application revision
        run: |
          app_checkout_sha="$(git rev-parse HEAD)"
          test "$app_checkout_sha" = "$UNOUML_EXPECTED_COMMIT"
          echo "Application checkout: $app_checkout_sha"
          echo "UNOUML_CHECKOUT_COMMIT=$app_checkout_sha" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/gpu-checks"
          echo "$app_checkout_sha" > "$RUNNER_TEMP/gpu-checks/app-commit.txt"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Compile and run GPU scene model contracts
        run: dotnet run --project tests/UnoUML.Gpu.Tests/UnoUML.Gpu.Tests.csproj -c Release
      - name: Validate production WGSL and offscreen pixel output
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/gpu-checks
        run: |
          CHROMIUM_PATH="$(command -v google-chrome)" node tests/browser/gpu-shaders.mjs
          CHROMIUM_PATH="$(command -v google-chrome)" node tests/browser/gpu-scene.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-checks
          path: ${{ runner.temp }}/gpu-checks/
          if-no-files-found: warn
