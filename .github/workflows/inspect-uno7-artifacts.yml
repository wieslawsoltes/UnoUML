name: Probe Uno 7 native focus through primary workspace and Ports
on:
  push:
    branches: [codex/uno7-artifact-inspection]
permissions:
  contents: read
  actions: read
jobs:
  focus-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UNOUML_REQUIRE_WEBGPU: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 69c14266574897c70af68e98b971ccd21361b61b
          persist-credentials: false
      - name: Record actual application revision
        run: |
          app_checkout_sha="$(git rev-parse HEAD)"
          echo "UNOUML_PROBE_COMMIT=$app_checkout_sha" >> "$GITHUB_ENV"
          echo "Application checkout: $app_checkout_sha"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare native and browser dependencies
        run: |
          dotnet workload install wasm-tools --skip-manifest-update
          npm ci --ignore-scripts
          npm run prepare:renderer
      - name: Publish and stage the exact application revision
        run: |
          dotnet publish src/UnoUML.App -f net10.0-browserwasm -c Release -o "$RUNNER_TEMP/focus-site"
          node scripts/verify-uno7-assets.mjs src/UnoUML.App/obj/project.assets.json
          node scripts/stage-pages.mjs "$RUNNER_TEMP/focus-site/wwwroot" "$RUNNER_TEMP/focus-pages"
      - name: Run unchanged primary flow through mobile reload and Ports
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/uno7-focus-probe
        run: |
          node --input-type=module <<'JS'
          import {readFile,writeFile} from 'node:fs/promises';

          function deriveFocusProbe(source) {
            const once = (text, before, after, label) => {
              if (text.split(before).length !== 2) throw new Error('Unexpected workspace structure: ' + label);
              return text.replace(before, after);
            };
            const independent = 'async function verifyIndependentAuthoring(browser, url) {';
            const main = 'const external = process.env.WORKSPACE_URL;';
            const launch = '  browser = await chromium.launch(graphicsLaunchOptions());';
            const throughPorts = '  await verifyPorts(page);\n';
            const errorGate = '  assert.deepEqual(errors, []);\n';
            const independentStart = source.indexOf(independent), mainStart = source.indexOf(main);
            const launchStart = source.indexOf(launch), portsEnd = source.indexOf(throughPorts) + throughPorts.length;
            if (independentStart < 0 || mainStart <= independentStart || launchStart < mainStart
                || portsEnd < launchStart || source.split(throughPorts).length !== 2)
              throw new Error('Cannot identify the unchanged primary prefix through verifyPorts');
            const retainedPrefix = source.slice(launchStart, portsEnd);
            let probe = source.slice(0, independentStart) + source.slice(mainStart);
            const cut = probe.indexOf(throughPorts) + throughPorts.length;
            const errorStart = probe.indexOf(errorGate, cut);
            const catchStart = probe.indexOf('} catch (error) {', errorStart);
            if (errorStart < cut || catchStart < errorStart) throw new Error('Cannot identify primary error gate and cleanup');
            probe = probe.slice(0, cut) + probe.slice(errorStart, errorStart + errorGate.length)
              + "  console.log('Passed focused primary workspace through mobile draft reload and Ports at ' + appCommit);\n"
              + probe.slice(catchStart);
            probe = once(probe, main, [
              "const appCommit = process.env.UNOUML_PROBE_COMMIT;",
              "if (!/^[0-9a-f]{40}$/.test(appCommit ?? '')) throw new Error('The workflow must provide the actual git checkout SHA');",
              '',
              main
            ].join('\n'), 'actual checkout metadata');
            probe = once(probe, [
              '} finally {',
              '  // Capture the primary failure before releasing its GPU context. Run every',
              '  // isolated authoring scenario once after the primary flow has finished.',
              "  if (page) await collectFailure('Could not close primary workspace page', () => page.close());",
              '  if (browser) {',
              "    await collectFailure('Independent authoring workspace checks failed', () => verifyIndependentAuthoring(browser, url));",
              '  }'
            ].join('\n'), [
              '} finally {',
              "  await collectFailure('Could not save focused native-control diagnostics', async () => {",
              '    if (process.env.SCREENSHOT_DIR) {',
              '      await mkdir(process.env.SCREENSHOT_DIR, {recursive:true});',
              '      const diagnostics = {',
              "        appCommit, scope:'Primary startup and editing through mobile draft reload and verifyPorts',",
              '        nativeActions:page ? getNativeControlDiagnostics(page) : [],',
              "        failures:failures.map(error => ({message:String(error.message).slice(0,4096), stack:error.stack?.slice(0,16384)}))",
              '      };',
              "      await writeFile(resolve(process.env.SCREENSHOT_DIR, 'focus-probe-diagnostics.json'), JSON.stringify(diagnostics,null,2));",
              '    }',
              '  });',
              "  if (page) await collectFailure('Could not close primary workspace page', () => page.close());"
            ].join('\n'), 'independent execution removal and native diagnostics');
            probe = once(probe,
              "  console.error('Failed primary desktop/mobile workspace checks:', error);",
              "  console.error('Focused primary native-focus probe failed:', error);", 'failure scope label');
            probe = once(probe,
              "  failures.push(new Error('Primary desktop/mobile workspace checks failed', {cause:error}));",
              "  failures.push(new Error('Focused primary native-focus probe failed', {cause:error}));", 'failure aggregate label');
            probe = once(probe,
              "if (failures.length) throw new AggregateError(failures, 'Published workspace checks failed');",
              "if (failures.length) throw new AggregateError(failures, 'Focused primary native-focus probe failed');", 'final scope label');
            if (!probe.includes(retainedPrefix) || probe.split(errorGate).length !== 2)
              throw new Error('The original primary prefix or browser-error assertion changed');
            if (probe.includes('verifyIndependentAuthoring(')
                || /await (verifyCompatibilityEditing|verifyTypedFields|verifySaltEditing|verifyYamlEditing|verifyDotEditing|verifyGpuFallback|verifyArchiveImport|verifyArchiveAliasEditing|verifyImportedPageRouting|verifyNativeCompatibility|compareRenderers)\(/.test(probe))
              throw new Error('The focused probe still invokes a later authoring scenario');
            return probe;
          }

          const source=await readFile('tests/browser/workspace.mjs','utf8');
          const probe=deriveFocusProbe(source);
          await writeFile('tests/browser/uno7-focus-probe.mjs',probe);
          console.log('Retained the unchanged primary prefix through verifyPorts and its original browser-error assertion.');
          JS
          node --check tests/browser/uno7-focus-probe.mjs
          CHROMIUM_PATH="$(command -v google-chrome)" node tests/browser/uno7-focus-probe.mjs "$RUNNER_TEMP/focus-pages"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uno7-focus-probe
          path: ${{ runner.temp }}/uno7-focus-probe/
          if-no-files-found: warn
